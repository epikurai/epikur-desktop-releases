name: Epikur 7.0 for Mac

# Builds the Epikur 7.0 desktop app from an exact commit on epikur_7.0 main, signs it with the
# existing Developer ID, notarizes and staples both app and DMG, and publishes Epikur.dmg.
# The download link on epikur.ai points at the moving release epikur-7-mac.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit on epikur_7.0 main (empty = newest main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: epikur-7-mac
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'epikurai/epikur-desktop-releases' && github.ref == 'refs/heads/main'
    environment: desktop-source
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Fetch the exact 7.0 commit, then remove the read-only key
        id: source
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.EPIKUR7_DESKTOP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/epikur7-source-key.XXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/epikur7-known-hosts.XXXXXX")"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          test -n "$SOURCE_DEPLOY_KEY"
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$key_file"
          unset SOURCE_DEPLOY_KEY
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 --header "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | jq -er '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          unset GH_TOKEN
          printf -v key_argument '%q' "$key_file"
          printf -v hosts_argument '%q' "$known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key_argument -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts_argument"
          log_file="$RUNNER_TEMP/private-source-checkout.log"
          git clone --filter=blob:none --no-checkout git@github.com:epikurai/epikur_7.0.git source > "$log_file" 2>&1
          if test -n "$INPUT_SHA"; then
            [[ "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]] || { printf 'source_sha must be a commit SHA.\n'; exit 1; }
            sha="$(git -C source rev-parse --verify --quiet "$INPUT_SHA^{commit}")" || { printf 'The commit is not on epikur_7.0.\n'; exit 1; }
          else
            sha="$(git -C source rev-parse origin/main)"
          fi
          git -C source merge-base --is-ancestor "$sha" origin/main || { printf 'The commit is not on epikur_7.0 main.\n'; exit 1; }
          git -C source checkout --detach "$sha" >> "$log_file" 2>&1
          test -z "$(git -C source status --porcelain)"
          printf 'source_sha=%s\nversion=7.0.%s\n' "$sha" "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'Source commit %s fetched; read-only key removed.\n' "$sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/desktop/package-lock.json
      - name: Test and package the unsigned universal app without signing credentials
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          cd source/desktop
          if ! npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/npm-install.log" 2>&1; then
            printf 'Locked desktop dependency installation failed.\n'; exit 1
          fi
          if ! node node_modules/electron/install.js > "$RUNNER_TEMP/electron-install.log" 2>&1; then
            printf 'Pinned Electron installation failed.\n'; exit 1
          fi
          if ! node tjek-adresse.js > "$RUNNER_TEMP/address.log" 2>&1; then
            printf 'The default server address is not https.\n'; exit 1
          fi
          if ! node --test > "$RUNNER_TEMP/desktop-tests.log" 2>&1; then
            printf 'Desktop tests failed; private source logs remain on the ephemeral runner only.\n'; exit 1
          fi
          if ! npx --no-install electron-builder --config byg.config.js --mac dir --universal -c.mac.identity=null -c.extraMetadata.version="$RELEASE_VERSION" > "$RUNNER_TEMP/package.log" 2>&1; then
            printf 'Packaging failed.\n'; grep -E '⨯|Error' "$RUNNER_TEMP/package.log" | grep -v "$GITHUB_WORKSPACE" | head -5 || true; exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/mac-universal/Epikur.app/Contents/Info.plist)" = "$RELEASE_VERSION"
          mkdir -m 700 "$RUNNER_TEMP/unsigned"
          ditto -c -k --keepParent dist/mac-universal/Epikur.app "$RUNNER_TEMP/unsigned/Epikur.app.zip"
          printf 'Desktop tests passed; unsigned universal app %s packaged.\n' "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epikur-7-mac-unsigned
          path: ${{ runner.temp }}/unsigned/Epikur.app.zip
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: build
    environment: desktop-signing
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: epikur-7-mac-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Sign with Developer ID, notarize and staple app and DMG
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: bash tools/sign-epikur-7-mac.sh "$RUNNER_TEMP/unsigned/Epikur.app.zip" "$RUNNER_TEMP/signed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epikur-7-mac-signed
          path: ${{ runner.temp }}/signed/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: epikur-7-mac-signed
          path: ${{ runner.temp }}/signed
      - name: Publish versioned release and update the moving download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/signed"
          sha256sum --check Epikur.dmg.sha256
          notes="Epikur $RELEASE_VERSION til Mac (Apple Silicon og Intel). Signeret med Developer ID og notariseret af Apple. Kildecommit: $SOURCE_SHA"
          gh release create "epikur-7.0-mac-$RELEASE_VERSION" Epikur.dmg Epikur.dmg.sha256 signing-receipt.json --repo "$REPO" --title "Epikur $RELEASE_VERSION til Mac" --notes "$notes" --latest=false
          if ! gh release view epikur-7-mac --repo "$REPO" > /dev/null 2>&1; then
            gh release create epikur-7-mac --repo "$REPO" --title "Epikur til Mac" --notes "$notes" --latest=false
          fi
          gh release upload epikur-7-mac Epikur.dmg Epikur.dmg.sha256 signing-receipt.json --repo "$REPO" --clobber
          gh release edit epikur-7-mac --repo "$REPO" --notes "$notes"
          url="https://github.com/$REPO/releases/download/epikur-7-mac/Epikur.dmg"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$url" -o published.dmg
          test "$(sha256sum published.dmg | cut -d' ' -f1)" = "$(cut -d' ' -f1 Epikur.dmg.sha256)"
          printf 'Published %s and verified the public download: %s\n' "$RELEASE_VERSION" "$url"
